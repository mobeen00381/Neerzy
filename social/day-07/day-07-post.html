<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<title>Neerzy Day 7 — Trust "Real reviews. Real customers." (FB &amp; IG Feed 4:5)</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet" />
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { background: #0B3D2E; }
  body {
    font-family: 'Inter', 'Segoe UI', system-ui, -apple-system, sans-serif;
    color: #FFFFFF;
    -webkit-font-smoothing: antialiased;
  }
  .post {
    position: relative;
    width: 1080px;
    height: 1350px;
    background: #0B3D2E;
    overflow: hidden;
    display: flex;
    flex-direction: column;
    align-items: center;
    text-align: center;
    padding: 48px 66px 46px;
  }
  .ring { position: absolute; border: 3px solid #0F5132; border-radius: 50%; pointer-events: none; }
  .r1 { width: 620px; height: 620px; top: -360px; left: -240px; }
  .r2 { width: 420px; height: 420px; top: -240px; left: -150px; }
  .r3 { width: 740px; height: 740px; bottom: -430px; right: -280px; }
  .inner { position: relative; z-index: 2; display: flex; flex-direction: column; align-items: center; width: 100%; }

  .logo { width: 250px; }
  .pill {
    margin-top: 26px;
    border: 3px solid #22C55E;
    color: #22C55E;
    font-weight: 800;
    font-size: 26px;
    letter-spacing: 4px;
    padding: 10px 34px;
    border-radius: 999px;
    text-transform: uppercase;
  }
  h1 {
    margin-top: 30px;
    max-width: 950px;
    font-size: 56px;
    font-weight: 900;
    line-height: 1.16;
    letter-spacing: -0.5px;
    color: #FFFFFF;
  }
  h1 .accent { color: #22C55E; }

  .seal { margin-top: 34px; }
  .seal-wrap {
    position: relative;
    width: 200px; height: 200px;
    display: flex; align-items: center; justify-content: center;
  }
  .pledge {
    margin-top: 36px;
    display: flex; flex-direction: column; align-items: center;
    gap: 22px;
    width: 100%;
    max-width: 780px;
  }
  .pl {
    display: flex; align-items: center; gap: 24px;
    background: #0F5132;
    border: 2px solid #1b6a46;
    border-radius: 999px;
    padding: 18px 40px 18px 22px;
    text-align: left;
  }
  .pl .tick {
    flex: 0 0 auto;
    width: 64px; height: 64px;
    background: #22C55E;
    border-radius: 50%;
    display: flex; align-items: center; justify-content: center;
  }
  .pl .t { font-size: 49px; font-weight: 900; letter-spacing: -0.5px; color: #FFFFFF; white-space: nowrap; }

  .divider { margin-top: 40px; font-size: 31px; font-weight: 600; color: #E6F2EA; line-height: 1.5; max-width: 880px; }
  .divider b { color: #22C55E; font-weight: 800; }

  .cta-pill {
    margin-top: 48px;
    display: inline-flex; align-items: center; gap: 14px;
    background: #22C55E;
    color: #0A2E22;
    font-weight: 900;
    font-size: 36px;
    padding: 20px 46px;
    border-radius: 999px;
  }
  .foot { margin-top: 22px; font-size: 25px; font-weight: 600; color: #B7DEC7; }
  .foot b { color: #22C55E; }
</style>
</head>
<body>
<div class="post" id="post">
  <div class="ring r1"></div><div class="ring r2"></div><div class="ring r3"></div>
  <div class="inner">
    <img class="logo" src="file:///C:/Neerzy/public/images/logo-white.svg" alt="Neerzy" />
    <div class="pill">Our promise</div>

    <h1>We will <span class="accent">never</span> fake a review for you.</h1>

    <svg class="seal" viewBox="0 0 200 200" width="200" height="200" fill="none">
      <circle cx="100" cy="100" r="94" stroke="#0F5132" stroke-width="8"/>
      <circle cx="100" cy="100" r="80" stroke="#22C55E" stroke-width="6"/>
      <path d="M58 104l30 30 56-68" stroke="#22C55E" stroke-width="14" stroke-linecap="round" stroke-linejoin="round"/>
    </svg>

    <div class="pledge">
      <div class="pl">
        <div class="tick">
          <svg viewBox="0 0 48 48" width="34" height="34" fill="none" stroke="#0A2E22" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"><path d="M10 26l10 10 18-24"/></svg>
        </div>
        <div class="t">Real reviews.</div>
      </div>
      <div class="pl">
        <div class="tick">
          <svg viewBox="0 0 48 48" width="34" height="34" fill="none" stroke="#0A2E22" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"><path d="M10 26l10 10 18-24"/></svg>
        </div>
        <div class="t">Real customers.</div>
      </div>
      <div class="pl">
        <div class="tick">
          <svg viewBox="0 0 48 48" width="34" height="34" fill="none" stroke="#0A2E22" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"><path d="M10 26l10 10 18-24"/></svg>
        </div>
        <div class="t">Every time.</div>
      </div>
    </div>

    <p class="divider">Google-compliant. No tricks, no shortcuts —<br/>just <b>real, happy customers</b> leaving real reviews.</p>

    <div class="cta-pill">Read How We Keep Things Fair</div>
    <div class="foot">neerzy.com &nbsp;·&nbsp; <b>link in bio</b></div>
  </div>
</div>
</body>
</html>
