<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<title>Neerzy Day 6 — Engagement "Which one are you today?" (FB &amp; IG Feed 4:5)</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet" />
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { background: #0B3D2E; }
  body {
    font-family: 'Inter', 'Segoe UI', system-ui, -apple-system, sans-serif;
    color: #FFFFFF;
    -webkit-font-smoothing: antialiased;
  }
  .post {
    position: relative;
    width: 1080px;
    height: 1350px;
    background: #0B3D2E;
    overflow: hidden;
    display: flex;
    flex-direction: column;
    align-items: center;
    text-align: center;
    padding: 46px 62px 46px;
  }
  .ring { position: absolute; border: 3px solid #0F5132; border-radius: 50%; pointer-events: none; }
  .r1 { width: 620px; height: 620px; top: -360px; left: -240px; }
  .r2 { width: 420px; height: 420px; top: -240px; left: -150px; }
  .r3 { width: 740px; height: 740px; bottom: -430px; right: -280px; }
  .inner { position: relative; z-index: 2; display: flex; flex-direction: column; align-items: center; width: 100%; }

  .logo { width: 250px; }
  .pill {
    margin-top: 24px;
    border: 3px solid #22C55E;
    color: #22C55E;
    font-weight: 800;
    font-size: 26px;
    letter-spacing: 3px;
    padding: 10px 30px;
    border-radius: 999px;
    text-transform: uppercase;
  }
  h1 {
    margin-top: 30px;
    max-width: 950px;
    font-size: 56px;
    font-weight: 900;
    line-height: 1.14;
    letter-spacing: -0.5px;
    color: #FFFFFF;
  }
  .arrow { margin-top: 12px; }

  .opts { margin-top: 46px; display: flex; flex-direction: column; gap: 26px; width: 100%; max-width: 956px; }
  .opt {
    position: relative;
    display: flex;
    align-items: center;
    gap: 28px;
    background: #0F5132;
    border: 2px solid #1b6a46;
    border-radius: 30px;
    padding: 32px 34px;
    text-align: left;
  }
  .opt .icon {
    flex: 0 0 auto;
    width: 104px; height: 104px;
    background: #22C55E;
    border-radius: 28px;
    display: flex; align-items: center; justify-content: center;
  }
  .opt .txt { display: flex; flex-direction: column; gap: 6px; }
  .opt .title { font-size: 33px; font-weight: 800; line-height: 1.28; color: #FFFFFF; }
  .opt .sub { font-size: 27px; font-weight: 600; color: #B7DEC7; }
  .opt .letter {
    position: absolute;
    top: 20px; right: 24px;
    width: 56px; height: 56px;
    border-radius: 18px;
    border: 3px solid #22C55E;
    display: flex; align-items: center; justify-content: center;
    font-size: 34px; font-weight: 900; color: #22C55E;
    background: #0F5132;
  }
  .opt .txtr { flex: 1; padding-right: 78px; }

  .cta-pill {
    margin-top: 60px;
    display: inline-flex; align-items: center; gap: 16px;
    background: #22C55E;
    color: #0A2E22;
    font-weight: 900;
    font-size: 38px;
    padding: 20px 46px;
    border-radius: 999px;
  }
  .note { margin-top: 32px; font-size: 29px; font-weight: 600; color: #E6F2EA; line-height: 1.45; max-width: 880px; }
  .note b { color: #22C55E; font-weight: 800; }
  .foot { margin-top: 26px; font-size: 25px; font-weight: 600; color: #B7DEC7; }
  .foot b { color: #22C55E; }
</style>
</head>
<body>
<div class="post" id="post">
  <div class="ring r1"></div><div class="ring r2"></div><div class="ring r3"></div>
  <div class="inner">
    <img class="logo" src="file:///C:/Neerzy/public/images/logo-white.svg" alt="Neerzy" />
    <div class="pill">No judgement zone</div>

    <h1>Which one are you today?</h1>
    <svg class="arrow" viewBox="0 0 48 48" width="40" height="40" fill="none">
      <path d="M24 8v26" stroke="#22C55E" stroke-width="4.5" stroke-linecap="round"/>
      <path d="M12 26l12 12 12-12" stroke="#22C55E" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round"/>
    </svg>

    <div class="opts">
      <div class="opt">
        <div class="icon">
          <svg viewBox="0 0 48 48" width="54" height="54" fill="none" stroke="#0A2E22" stroke-width="3.4" stroke-linecap="round" stroke-linejoin="round">
            <path d="M14.7 6.3a1 1 0 0 0 0 1.4l1.6 1.6a1 1 0 0 0 1.4 0l3.77-3.77a6 6 0 0 1-7.94 7.94l-6.91 6.91a2.12 2.12 0 0 1-3-3l6.91-6.91a6 6 0 0 1 7.94-7.94l-3.76 3.76z"/>
            <path d="M22 8l6 6"/>
          </svg>
        </div>
        <div class="txt txtr">
          <div class="title">"I'll post online later."</div>
          <div class="sub">(you never do)</div>
        </div>
        <div class="letter">A</div>
      </div>

      <div class="opt">
        <div class="icon">
          <svg viewBox="0 0 48 48" width="52" height="52" fill="none" stroke="#0A2E22" stroke-width="3.4" stroke-linecap="round" stroke-linejoin="round">
            <rect x="7" y="3" width="34" height="42" rx="6"/>
            <line x1="22" y1="40" x2="26" y2="40"/>
            <line x1="12" y1="10" x2="36" y2="10"/>
          </svg>
        </div>
        <div class="txt txtr">
          <div class="title">"I don't even know what a Google Business Profile is."</div>
        </div>
        <div class="letter">B</div>
      </div>

      <div class="opt">
        <div class="icon">
          <svg viewBox="0 0 48 48" width="54" height="54" fill="none">
            <circle cx="24" cy="24" r="20" fill="none" stroke="#0A2E22" stroke-width="3.4"/>
            <circle cx="17" cy="19" r="3" fill="#0A2E22"/>
            <circle cx="31" cy="19" r="3" fill="#0A2E22"/>
            <path d="M15 27c3 5.4 6 8 9 8s6-2.6 9-8" stroke="#0A2E22" stroke-width="3.4" stroke-linecap="round"/>
          </svg>
        </div>
        <div class="txt txtr">
          <div class="title">"I forgot to ask for a review again."</div>
        </div>
        <div class="letter">C</div>
      </div>
    </div>

    <div class="cta-pill">Comment Your Emoji Below</div>
    <p class="note">No judgement — <b>that's exactly why we built Neerzy.</b></p>
    <div class="foot">neerzy.com &nbsp;·&nbsp; <b>link in bio</b></div>
  </div>
</div>
</body>
</html>
