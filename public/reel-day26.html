<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Neerzy Day 26 Reel - No apps. No dashboards. No tech skills. (9:16)</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet" />
<style>
  :root { color-scheme: dark; }
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; background: #04170f; color: #fff;
    font-family: "Inter", "Segoe UI", system-ui, sans-serif; }
  #wrap { display: flex; flex-direction: column; align-items: center; padding: 18px 12px 30px; }
  h1 { font-size: 16px; margin: 4px 0 2px; }
  .sub { color: #9fc0b1; font-size: 12px; margin-bottom: 12px; text-align: center; }
  canvas { width: min(42vw, 400px); aspect-ratio: 9 / 16; height: auto; border-radius: 18px;
    background: #000; box-shadow: 0 18px 50px rgba(0,0,0,.55); display: block; }
</style>
</head>
<body>
<div id="wrap">
  <h1>Neerzy - Day 26 reel - No apps. No dashboards. No tech skills.</h1>
  <div class="sub">1080&times;1920 &bull; 9:16 &bull; deterministic frames - rendered by reel/make-reel.mjs</div>
  <canvas id="cv" width="1080" height="1920"></canvas>
</div>
<script>
"use strict";
const W = 1080, H = 1920;
const cv = document.getElementById('cv');
const ctx = cv.getContext('2d');
const C = {
  bgTop: '#0B3D2E', bgBot: '#06251B',
  bgScene: '#0A3426', bgDeep: '#06251B',
  card: '#0F5132', cardLine: '#1b6a46',
  accent: '#22C55E', accentSoft: '#4ADE80',
  white: '#FFFFFF', mint: '#E6F2EA', ink: '#0A2E22',
  sub: '#B7DEC7', muted: '#7E9C8C', warn: '#B4574B'
};
const TXT = "'Inter', 'Segoe UI', system-ui, sans-serif";

function rr(x, y, w, h, r) { ctx.beginPath(); ctx.roundRect(x, y, w, h, r); }
function bgPaint() {
  const g = ctx.createLinearGradient(0, 0, 0, H);
  g.addColorStop(0, C.bgTop); g.addColorStop(1, C.bgBot);
  ctx.fillStyle = g; ctx.fillRect(0, 0, W, H);
}
function bgScenePaint() {
  const g = ctx.createLinearGradient(0, 0, 0, H);
  g.addColorStop(0, C.bgScene); g.addColorStop(1, C.bgDeep);
  ctx.fillStyle = g; ctx.fillRect(0, 0, W, H);
}
function setFont(px, weight) {
  ctx.font = (weight || 800) + ' ' + px + 'px ' + TXT;
  ctx.textAlign = 'center'; ctx.textBaseline = 'alphabetic';
}
function fitSize(text, px, maxW, weight) {
  let s = px;
  while (s > 16) {
    setFont(s, weight);
    if (ctx.measureText(text).width <= maxW) break;
    s -= 2;
  }
  return s;
}
function ctext(text, cy, maxW, px, weight, color) {
  ctx.fillStyle = color;
  const s = fitSize(text, px, maxW, weight);
  setFont(s, weight);
  ctx.fillText(text, W / 2, cy);
  return s;
}
function wrapText(lines, maxInner, size, weight) {
  ctx.font = (weight || 600) + ' ' + size + 'px ' + TXT;
  const out = [];
  const src = Array.isArray(lines) ? lines : [lines];
  for (const raw of src) {
    const words = String(raw).split(' ');
    let cur = '';
    for (const w of words) {
      const t = cur ? cur + ' ' + w : w;
      if (ctx.measureText(t).width <= maxInner || !cur) cur = t;
      else { out.push(cur); cur = w; }
    }
    if (cur) out.push(cur);
  }
  return out;
}
function alpha(tt, a0, a1, t0, t1) {
  if (tt < t0) return 0;
  if (tt > t1) return a1;
  return a0 + (a1 - a0) * (tt - t0) / (t1 - t0);
}
function ease(t) { return t < 0 ? 0 : t > 1 ? 1 : 1 - (1 - t) * (1 - t); }
function rise(t, t0, span) {
  return (1 - ease(Math.min(1, Math.max(0, (t - t0) / (span || 0.5))))) * 44;
}
function decorRings(accentDots) {
  ctx.lineWidth = 3; ctx.strokeStyle = C.card;
  for (const r of [[60, 250, 420], [40, 200, 300], [W - 40, H - 260, 430], [W - 90, H - 340, 290]]) {
    ctx.beginPath(); ctx.arc(r[0], r[1], r[2], 0, Math.PI * 2); ctx.stroke();
  }
  if (accentDots) {
    ctx.fillStyle = C.accent;
    for (const d of accentDots) { ctx.beginPath(); ctx.arc(d[0], d[1], d[2], 0, Math.PI * 2); ctx.fill(); }
  }
}
function badge(label, cy, t, t0) {
  const a = ease(alpha(t, 0, 1, t0, t0 + 0.6));
  if (a <= 0.01) return;
  ctx.globalAlpha = a;
  ctx.letterSpacing = '7px';
  ctx.font = '800 34px ' + TXT;
  ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  const tw = ctx.measureText(label).width;
  const ph = 74;
  rr(W / 2 - (tw + 90) / 2, cy, tw + 90, ph, 40);
  ctx.strokeStyle = C.accent; ctx.lineWidth = 4; ctx.stroke();
  ctx.fillStyle = C.accent;
  ctx.fillText(label, W / 2, cy + ph / 2 + 2);
  ctx.letterSpacing = '0px';
  ctx.textBaseline = 'alphabetic';
  ctx.globalAlpha = 1;
}
function tick(cx, cy, r, color) {
  ctx.beginPath(); ctx.arc(cx, cy, r, 0, Math.PI * 2);
  ctx.fillStyle = color || C.accent; ctx.fill();
  ctx.strokeStyle = C.ink; ctx.lineWidth = 4; ctx.lineCap = 'round'; ctx.lineJoin = 'round';
  ctx.beginPath();
  ctx.moveTo(cx - r * 0.45, cy);
  ctx.lineTo(cx - r * 0.12, cy + r * 0.34);
  ctx.lineTo(cx + r * 0.5, cy - r * 0.4);
  ctx.stroke();
}
function cross(cx, cy, r, color) {
  ctx.strokeStyle = color || C.warn; ctx.lineWidth = 4; ctx.lineCap = 'round';
  ctx.beginPath();
  ctx.moveTo(cx - r * 0.4, cy - r * 0.4); ctx.lineTo(cx + r * 0.4, cy + r * 0.4);
  ctx.moveTo(cx + r * 0.4, cy - r * 0.4); ctx.lineTo(cx - r * 0.4, cy + r * 0.4);
  ctx.stroke();
}
function neerzyWord(cx, cy, k) {
  const s = 118 * k;
  rr(cx - 330 * k, cy - s / 2 - 6 * k, s, s, s * 0.3);
  ctx.fillStyle = C.accent; ctx.fill();
  setFont(66 * k, 900);
  ctx.textBaseline = 'middle';
  ctx.fillStyle = C.ink;
  ctx.fillText('n', cx - 330 * k + s / 2, cy + 2 * k);
  setFont(112 * k, 900);
  ctx.textAlign = 'left';
  ctx.fillStyle = C.white;
  ctx.fillText('neerzy', cx - 190 * k, cy);
  ctx.textAlign = 'center'; ctx.textBaseline = 'alphabetic';
}
function pill(label, cy, k, t, t0) {
  const a = ease(alpha(t, 0, 1, t0, t0 + 0.6));
  if (a <= 0.01) return;
  const scale = 0.9 + 0.1 * ease(Math.min(1, Math.max(0, (t - t0) / 0.6)));
  ctx.save();
  ctx.translate(W / 2, cy);
  ctx.scale(scale, scale);
  ctx.globalAlpha = a;
  setFont(56 * k, 900);
  const tw = ctx.measureText(label).width;
  rr(-(tw + 170 * k) / 2, -78 * k, tw + 170 * k, 156 * k, 78 * k);
  ctx.fillStyle = C.accent; ctx.fill();
  ctx.fillStyle = C.ink;
  ctx.textBaseline = 'middle';
  ctx.fillText(label, 0, 8 * k);
  ctx.textBaseline = 'alphabetic';
  ctx.restore();
  ctx.globalAlpha = 1;
}
const PHONE = { x: 150, y: 478, w: 780, h: 1000 };
function phoneFrame(t, t0) {
  const a = ease(alpha(t, 0, 1, t0, t0 + 0.7));
  const y0 = (1 - ease(Math.min(1, Math.max(0, (t - t0) / 0.7)))) * 60;
  if (a <= 0.01) return null;
  ctx.globalAlpha = a;
  const x = PHONE.x, y = PHONE.y + y0, w = PHONE.w, h = PHONE.h;
  const headerH = 166;
  rr(x, y, w, h, 60); ctx.fillStyle = C.ink; ctx.fill();
  const sx = x + 22, sy = y + 22, sw = w - 44, sh = h - 44;
  rr(sx, sy, sw, sh, 40); ctx.fillStyle = C.mint; ctx.fill();
  rr(sx, sy, sw, headerH, 40); ctx.fillStyle = C.card; ctx.fill();
  rr(sx, sy + headerH - 30, sw, 30, 0); ctx.fill();
  ctx.strokeStyle = C.accent; ctx.lineWidth = 3;
  ctx.beginPath(); ctx.arc(sx + 78, sy + headerH / 2, 26, 0, Math.PI * 2); ctx.stroke();
  ctx.beginPath(); ctx.arc(sx + 78, sy + headerH / 2, 14, 0, Math.PI * 2);
  ctx.fillStyle = C.accent; ctx.fill();
  setFont(42, 800);
  ctx.textAlign = 'left';
  ctx.fillStyle = C.white;
  ctx.fillText('Neerzy', sx + 126, sy + 76);
  setFont(26, 500);
  ctx.textAlign = 'left';
  ctx.fillStyle = C.sub;
  ctx.fillText('Your marketing, handled', sx + 126, sy + 122);
  setFont(26, 700);
  ctx.textAlign = 'center';
  ctx.fillStyle = '#0F5132';
  rr(sx + sw - 166, sy + 40, 142, 48, 24); ctx.fill();
  ctx.fillStyle = C.white;
  ctx.fillText('7:42 PM', sx + sw - 95, sy + 74);
  ctx.textAlign = 'center';
  ctx.globalAlpha = 1;
  return { sx, sy, sw, sh };
}
function bubble(x, y, maxW, lines, o) {
  const s = o.size || 36;
  const weight = o.weight || 600;
  const pad = o.pad || 26;
  const lh = Math.round(s * 1.42);
  const lns = wrapText(lines, maxW - pad * 2, s, weight);
  ctx.font = weight + ' ' + s + 'px ' + TXT;
  ctx.textAlign = 'left'; ctx.textBaseline = 'alphabetic';
  let tw = 0;
  lns.forEach((l) => { tw = Math.max(tw, ctx.measureText(l).width); });
  const bw = Math.min(maxW, tw + pad * 2);
  const bh = lns.length * lh + pad * 2;
  const x0 = o.right ? x + maxW - bw : x;
  rr(x0, y, bw, bh, 24);
  ctx.fillStyle = o.bg || C.white; ctx.fill();
  ctx.fillStyle = o.color || C.ink;
  lns.forEach((l, i) => ctx.fillText(l, x0 + pad, y + pad + lh * (i + 1) - 8));
  ctx.textAlign = 'center';
  return bh;
}
function resultRow(cx, y, w, text, pop) {
  if (pop <= 0.01) return 0;
  ctx.save();
  ctx.translate(cx, y + 34);
  const k = 0.9 + 0.1 * Math.min(1, pop);
  ctx.scale(k, k);
  ctx.globalAlpha = Math.min(1, pop);
  rr(-w / 2, -34, w, 68, 20);
  ctx.fillStyle = C.white; ctx.fill();
  tick(-w / 2 + 34, 0, 15);
  setFont(31, 700);
  ctx.textAlign = 'left'; ctx.textBaseline = 'middle';
  ctx.fillStyle = C.ink;
  ctx.fillText(text, -w / 2 + 66, 1);
  ctx.restore();
  ctx.globalAlpha = 1;
  ctx.textAlign = 'center'; ctx.textBaseline = 'alphabetic';
  return 68;
}

/* ---------------- SCENES ---------------- */
function sceneHook(t, d) {
  if (d.mood === 'scene') bgScenePaint(); else bgPaint();
  decorRings([[950, 320, 10], [120, 1580, 9], [930, 1720, 7]]);
  badge(d.kicker, 470, t, 0.06 * d.dur);
  let a = ease(alpha(t, 0, 1, 0.22 * d.dur, 0.22 * d.dur + 0.7));
  if (a > 0.01) {
    ctx.globalAlpha = a;
    ctext(d.line1, 790 + rise(t, 0.22 * d.dur, 0.5), 940, 104, 900, C.white);
  }
  a = ease(alpha(t, 0, 1, 0.375 * d.dur, 0.375 * d.dur + 0.7));
  if (a > 0.01) {
    ctx.globalAlpha = a;
    ctext(d.line2, 930 + rise(t, 0.375 * d.dur, 0.5), 940, 104, 900, C.accent);
  }
  a = ease(alpha(t, 0, 1, 0.58 * d.dur, 0.58 * d.dur + 0.7));
  if (a > 0.01) {
    ctx.globalAlpha = a;
    ctext(d.sub, 1130, 900, 46, 600, C.sub);
  }
  a = ease(alpha(t, 0, 1, 0.75 * d.dur, 0.75 * d.dur + 0.55)) * 0.92;
  if (a > 0.01) {
    ctx.globalAlpha = a;
    setFont(34, 600);
    ctx.fillStyle = C.mint;
    ctx.fillText(d.tail, W / 2, 1640);
    ctx.fillStyle = C.accent;
    ctx.beginPath(); ctx.arc(W / 2, 1718, 9, 0, Math.PI * 2); ctx.fill();
  }
  ctx.globalAlpha = 1;
}

function sceneChat(t, d) {
  bgPaint();
  decorRings([[990, 232, 9], [120, 1700, 8]]);
  let a = ease(alpha(t, 0, 1, 0.03 * d.dur, 0.03 * d.dur + 0.55));
  if (a > 0.01) {
    ctx.globalAlpha = a;
    ctext(d.title, 330, 900, 56, 900, C.accent);
    ctx.globalAlpha = 1;
  }
  const phone = phoneFrame(t, 0.06 * d.dur);
  if (!phone) return;
  const { sx, sy, sw } = phone;
  const pad = 40;
  const rowW = sw - pad * 2;
  const cx = sx + sw / 2;
  const bubW = rowW - 60;
  const gap = 44;
  const userLines = wrapText([d.userMsg], bubW - 52, 36, 600);
  const userH = userLines.length * 51 + 52;
  const replyLines = wrapText(d.reply, bubW - 52, 36, 600);
  const replyH = replyLines.length * 51 + 52;
  const userY = sy + 220;
  const replyY = userY + userH + gap;
  const resultsY = replyY + replyH + 56;

  const aUser = ease(alpha(t, 0, 1, 0.14 * d.dur, 0.14 * d.dur + 0.55));
  if (aUser > 0.01) {
    ctx.globalAlpha = aUser;
    ctx.save();
    ctx.translate(0, rise(t, 0.14 * d.dur, 0.5));
    bubble(sx + pad, userY, bubW, userLines, { right: true, bg: '#DCF8C6' });
    ctx.restore();
    ctx.globalAlpha = 1;
  }

  const typingOn = t > 0.24 * d.dur && t < 0.34 * d.dur;
  if (typingOn) {
    ctx.globalAlpha = 0.9;
    rr(sx + pad, replyY, 150, 74, 24);
    ctx.fillStyle = C.white; ctx.fill();
    ctx.fillStyle = C.muted;
    for (let i = 0; i < 3; i++) {
      const bob = Math.sin((t * 6) + i * 1.1) * 5;
      ctx.beginPath();
      ctx.arc(sx + pad + 40 + i * 34, replyY + 37 + bob, 9, 0, Math.PI * 2);
      ctx.fill();
    }
    ctx.globalAlpha = 1;
  }

  const aReply = ease(alpha(t, 0, 1, 0.36 * d.dur, 0.36 * d.dur + 0.6));
  if (aReply > 0.01) {
    ctx.globalAlpha = aReply;
    ctx.save();
    ctx.translate(0, rise(t, 0.36 * d.dur, 0.5));
    bubble(sx + pad, replyY, bubW, replyLines, { bg: C.white });
    ctx.restore();
    ctx.globalAlpha = 1;
  }

  for (let i = 0; i < d.results.length; i++) {
    const t0 = (0.5 + i * 0.08) * d.dur;
    const pop = ease(alpha(t, 0, 1, t0, t0 + 0.5)) * ease(Math.min(1, (t - t0) / 0.4));
    resultRow(cx, resultsY + i * 100, rowW, d.results[i], pop);
  }
  ctx.globalAlpha = 1;
}

function sceneCards(t, d) {
  bgScenePaint();
  decorRings([[930, 300, 9], [110, 1720, 8]]);
  badge(d.kicker, 420, t, 0.05 * d.dur);
  let a = ease(alpha(t, 0, 1, 0.16 * d.dur, 0.16 * d.dur + 0.6));
  if (a > 0.01) {
    ctx.globalAlpha = a;
    ctext(d.title, 700, 900, 72, 900, C.white);
    ctx.globalAlpha = 1;
  }
  const cardW = 900;
  const x0 = W / 2 - cardW / 2;
  for (let i = 0; i < d.items.length; i++) {
    const t0 = (0.3 + i * 0.12) * d.dur;
    const p = ease(alpha(t, 0, 1, t0, t0 + 0.55));
    if (p <= 0.01) continue;
    ctx.save();
    ctx.globalAlpha = p;
    ctx.translate(0, rise(t, t0, 0.5));
    const y = 900 + i * 175;
    rr(x0, y, cardW, 132, 30);
    ctx.fillStyle = C.white; ctx.fill();
    tick(x0 + 78, y + 66, 26);
    const size = fitSize(d.items[i], 40, cardW - 190, 700);
    setFont(size, 700);
    ctx.textAlign = 'left'; ctx.textBaseline = 'middle';
    ctx.fillStyle = C.ink;
    ctx.fillText(d.items[i], x0 + 140, y + 68);
    ctx.restore();
    ctx.textAlign = 'center'; ctx.textBaseline = 'alphabetic';
  }
  ctx.globalAlpha = 1;
}

function sceneSplit(t, d) {
  bgPaint();
  let a = ease(alpha(t, 0, 1, 0.08 * d.dur, 0.08 * d.dur + 0.6));
  if (a > 0.01) {
    ctx.globalAlpha = a;
    ctext(d.title, 265, 940, 62, 900, C.white);
    ctx.globalAlpha = 1;
  }
  const pw = 440, ph = 1140, py = 420;
  const panels = [
    { x: 70, label: d.leftLabel, items: d.leftItems, good: false },
    { x: W - 70 - pw, label: d.rightLabel, items: d.rightItems, good: true }
  ];
  for (const panel of panels) {
    rr(panel.x, py, pw, ph, 44);
    ctx.fillStyle = panel.good ? C.card : '#0D3227';
    ctx.fill();
    ctx.lineWidth = 4;
    ctx.strokeStyle = panel.good ? C.accent : C.cardLine;
    ctx.stroke();
    ctx.letterSpacing = '3px';
    setFont(34, 900);
    ctx.fillStyle = panel.good ? C.accent : C.muted;
    ctx.fillText(panel.label, panel.x + pw / 2, py + 120);
    ctx.letterSpacing = '0px';
    for (let i = 0; i < panel.items.length; i++) {
      const t0 = ((panel.good ? 0.26 : 0.2) + i * 0.11) * d.dur;
      const p = ease(alpha(t, 0, 1, t0, t0 + 0.5));
      if (p <= 0.01) continue;
      ctx.globalAlpha = p;
      const y = py + 320 + i * 240;
      if (panel.good) tick(panel.x + 78, y - 10, 26);
      else cross(panel.x + 78, y - 10, 26);
      const size = fitSize(panel.items[i], 36, pw - 200, 600);
      setFont(size, 600);
      ctx.textAlign = 'left'; ctx.textBaseline = 'middle';
      ctx.fillStyle = panel.good ? C.mint : '#9AA79F';
      ctx.fillText(panel.items[i], panel.x + 130, y - 8);
      ctx.textAlign = 'center'; ctx.textBaseline = 'alphabetic';
      ctx.globalAlpha = 1;
    }
  }
}

function sceneScore(t, d) {
  bgScenePaint();
  decorRings([[930, 320, 9], [120, 1660, 8]]);
  const cx = W / 2, cy = 560, r = 168;
  const p = ease(Math.min(1, Math.max(0, (t - 0.08 * d.dur) / (0.42 * d.dur))));
  ctx.lineWidth = 24; ctx.lineCap = 'round';
  ctx.strokeStyle = C.cardLine;
  ctx.beginPath(); ctx.arc(cx, cy, r, 0, Math.PI * 2); ctx.stroke();
  ctx.strokeStyle = C.accent;
  ctx.beginPath();
  ctx.arc(cx, cy, r, -Math.PI / 2, -Math.PI / 2 + p * (d.score / 100) * Math.PI * 2);
  ctx.stroke();
  ctx.textBaseline = 'middle';
  setFont(150, 900);
  ctx.fillStyle = C.white;
  ctx.fillText(String(Math.round(d.score * p)), cx, cy - 14);
  setFont(38, 700);
  ctx.fillStyle = C.sub;
  ctx.fillText('out of 100', cx, cy + 74);
  ctx.textBaseline = 'alphabetic';
  let a = ease(alpha(t, 0, 1, 0.5 * d.dur, 0.5 * d.dur + 0.5));
  if (a > 0.01) {
    ctx.globalAlpha = a;
    ctext(d.label, cy + r + 108, 900, 44, 600, C.mint);
    ctx.globalAlpha = 1;
  }
  const bw = 840, bx = W / 2 - bw / 2;
  for (let i = 0; i < d.bars.length; i++) {
    const t0 = (0.45 + i * 0.09) * d.dur;
    const pa = ease(alpha(t, 0, 1, t0, t0 + 0.45));
    if (pa <= 0.01) continue;
    ctx.globalAlpha = pa;
    const y = 940 + i * 140;
    setFont(34, 700);
    ctx.textAlign = 'left'; ctx.fillStyle = C.mint;
    ctx.fillText(d.bars[i].label, bx, y);
    ctx.textAlign = 'right'; ctx.fillStyle = C.accent;
    ctx.fillText(d.bars[i].pct + '%', bx + bw, y);
    ctx.textAlign = 'center';
    rr(bx, y + 26, bw, 26, 13);
    ctx.fillStyle = C.cardLine; ctx.fill();
    const grown = ease(Math.min(1, Math.max(0, (t - t0) / 0.75)));
    rr(bx, y + 26, Math.max(14, bw * (d.bars[i].pct / 100) * grown), 26, 13);
    ctx.fillStyle = C.accent; ctx.fill();
    ctx.globalAlpha = 1;
  }
}

function sceneStat(t, d) {
  if (d.mood === 'flat') bgScenePaint(); else bgPaint();
  decorRings([[120, 380, 9], [940, 1500, 10]]);
  let a = ease(alpha(t, 0, 1, 0.1 * d.dur, 0.1 * d.dur + 0.7));
  if (a > 0.01) {
    ctx.globalAlpha = a;
    const s = fitSize(d.big, 132, 940, 900);
    setFont(s, 900);
    ctx.fillStyle = C.white;
    ctx.fillText(d.big, W / 2, 900 + rise(t, 0.1 * d.dur, 0.6));
    ctx.globalAlpha = 1;
  }
  a = ease(alpha(t, 0, 1, 0.42 * d.dur, 0.42 * d.dur + 0.7));
  if (a > 0.01) {
    ctx.globalAlpha = a;
    ctext(d.small, 1120, 860, 48, 600, C.sub);
    ctx.globalAlpha = 1;
  }
}

function sceneTimer(t, d) {
  bgScenePaint();
  const cx = W / 2, cy = 600, r = 200;
  const p = Math.min(1, Math.max(0, t / d.dur));
  const remain = Math.max(0, 300 * (1 - p));
  const mm = Math.floor(remain / 60);
  const ss = Math.floor(remain % 60);
  const label = mm + ':' + String(ss).padStart(2, '0');
  badge(d.label, 250, t, 0.02 * d.dur);
  ctx.lineWidth = 26; ctx.lineCap = 'round';
  ctx.strokeStyle = C.cardLine;
  ctx.beginPath(); ctx.arc(cx, cy, r, 0, Math.PI * 2); ctx.stroke();
  const col = p < 0.6 ? C.accent : (p < 0.85 ? '#F0B429' : C.warn);
  ctx.strokeStyle = col;
  ctx.beginPath();
  ctx.arc(cx, cy, r, -Math.PI / 2, -Math.PI / 2 + (1 - p) * Math.PI * 2);
  ctx.stroke();
  ctx.textBaseline = 'middle';
  setFont(132, 900);
  ctx.fillStyle = col;
  ctx.fillText(label, cx, cy);
  ctx.textBaseline = 'alphabetic';
  for (let i = 0; i < d.lines.length; i++) {
    const t0 = (0.25 + i * 0.12) * d.dur;
    const pa = ease(alpha(t, 0, 1, t0, t0 + 0.5));
    if (pa <= 0.01) continue;
    ctx.globalAlpha = pa;
    const y = 920 + i * 132;
    rr(cx - 400, y, 800, 96, 26);
    ctx.fillStyle = C.white; ctx.fill();
    tick(cx - 344, y + 48, 22);
    const size = fitSize(d.lines[i], 36, 640, 700);
    setFont(size, 700);
    ctx.textAlign = 'left'; ctx.textBaseline = 'middle';
    ctx.fillStyle = C.ink;
    ctx.fillText(d.lines[i], cx - 290, y + 50);
    ctx.textAlign = 'center'; ctx.textBaseline = 'alphabetic';
    ctx.globalAlpha = 1;
  }
}

function sceneOutro(t, d) {
  bgPaint();
  decorRings([[950, 330, 8], [110, 1560, 8], [960, 1680, 10]]);
  let a = ease(alpha(t, 0, 1, 0.05 * d.dur, 0.05 * d.dur + 0.7));
  if (a > 0.01) {
    ctx.globalAlpha = a;
    neerzyWord(W / 2 + 70, 470, 0.95);
    ctx.globalAlpha = 1;
  }
  a = ease(alpha(t, 0, 1, 0.2 * d.dur, 0.2 * d.dur + 0.7));
  if (a > 0.01) {
    ctx.globalAlpha = a;
    ctext(d.line, 820, 900, 50, 600, C.sub);
    ctx.globalAlpha = 1;
  }
  pill(d.cta, 1080, 1, t, 0.34 * d.dur);
  a = ease(alpha(t, 0, 1, 0.52 * d.dur, 0.52 * d.dur + 0.7));
  if (a > 0.01) {
    ctx.globalAlpha = a;
    setFont(36, 600);
    ctx.fillStyle = C.mint;
    ctx.fillText(d.footer, W / 2, 1330);
    ctx.globalAlpha = 1;
  }
}

const SCENES = {
  hook: sceneHook, chat: sceneChat, cards: sceneCards, split: sceneSplit,
  score: sceneScore, stat: sceneStat, timer: sceneTimer, outro: sceneOutro
};

const DATA = {"duration":21.5,"scenes":[{"kind":"hook","dur":4.2,"kicker":"REALLY","line1":"No dashboards.","line2":"No tech skills.","sub":"If you can send a message, you can use Neerzy.","tail":"That is the whole point."},{"kind":"split","dur":8.2,"title":"You already know how to use it","leftLabel":"OTHER TOOLS","leftItems":["Another login","Another dashboard","Another thing to learn"],"rightLabel":"NEERZY","rightItems":["Send a message","Tap to post","Done in a minute"]},{"kind":"cards","dur":5.6,"kicker":"AND YOUR CHOICE","title":"Use WhatsApp, SMS or a link","items":["Prefer no WhatsApp?","Sign in with email or Google","Post from the quick-post link"]},{"kind":"outro","dur":3.5,"line":"Marketing that fits into your day.","cta":"Start free","footer":"neerzy.com - link in bio"}]};

/* ---------------- TIMELINE + PUBLIC API ---------------- */
const TIMELINE = [];
let acc = 0;
for (const s of DATA.scenes) {
  TIMELINE.push({ start: acc, end: acc + s.dur, data: s });
  acc += s.dur;
}
const BOUNDS = TIMELINE.slice(1).map((s) => s.start);
const REEL = { DURATION: DATA.duration };

function draw(t) {
  ctx.clearRect(0, 0, W, H);
  let sc = TIMELINE[TIMELINE.length - 1];
  for (const s of TIMELINE) {
    if (t >= s.start && t < s.end) { sc = s; break; }
  }
  SCENES[sc.data.kind](t - sc.start, sc.data);
  for (const b of BOUNDS) {
    const d = Math.abs(t - b);
    if (d < 0.28) {
      ctx.globalAlpha = (1 - d / 0.28) * 0.95;
      ctx.fillStyle = '#000000';
      ctx.fillRect(0, 0, W, H);
      ctx.globalAlpha = 1;
    }
  }
}

let paused = false;
function frameAt(t) {
  paused = true;
  draw(Math.max(0, Math.min(REEL.DURATION - 0.04, t)));
}
window.__reel = REEL;
window.__frameAt = frameAt;
window.__pausePreview = () => { paused = true; };
window.__playPreview = () => { paused = false; };

let t0 = null;
function raf(now) {
  if (!paused) {
    if (t0 === null) t0 = now;
    draw(((now - t0) / 1000) % REEL.DURATION);
  }
  requestAnimationFrame(raf);
}
requestAnimationFrame(raf);

document.fonts.ready.then(() => { window.__reelReady = true; });
</script>
