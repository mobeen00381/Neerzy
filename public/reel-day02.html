<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Neerzy Day 2 Reel — Tired after work? (9:16)</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet" />
<style>
  :root { color-scheme: dark; }
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; background: #04170f; color: #fff;
    font-family: "Inter", "Segoe UI", system-ui, sans-serif; }
  #wrap { display: flex; flex-direction: column; align-items: center; padding: 18px 12px 30px; }
  h1 { font-size: 16px; margin: 4px 0 2px; }
  .sub { color: #9fc0b1; font-size: 12px; margin-bottom: 12px; text-align: center; }
  canvas { width: min(42vw, 400px); aspect-ratio: 9 / 16; height: auto; border-radius: 18px;
    background: #000; box-shadow: 0 18px 50px rgba(0,0,0,.55); display: block; }
</style>
</head>
<body>
<div id="wrap">
  <h1>Neerzy — Day 2 reel · Tired after work? So is your marketing.</h1>
  <div class="sub">1080&times;1920 &bull; 9:16 &bull; 22.5s &mdash; rendered frame-by-frame to MP4 by reel/render-day02.mjs</div>
  <canvas id="cv" width="1080" height="1920"></canvas>
</div>
<script>
"use strict";
/* =============================================================
   Neerzy Day 2 reel — Pain point story (brand palette locked)
   9:16 1080x1920 · 22.5s · deterministic per-frame drawing.
   ============================================================= */
const W = 1080, H = 1920;
const cv = document.getElementById('cv');
const ctx = cv.getContext('2d');
const C = {
  bgTop: '#0B3D2E', bgBot: '#06251B',
  bgScene: '#0A3426', bgDeep: '#06251B',
  card: '#0F5132', cardLine: '#1b6a46',
  accent: '#22C55E',
  white: '#FFFFFF', mint: '#E6F2EA', ink: '#0A2E22',
  sub: '#B7DEC7'
};
const TXT = "'Inter', 'Segoe UI', system-ui, sans-serif";

function rr(x, y, w, h, r) {
  ctx.beginPath();
  ctx.roundRect(x, y, w, h, r);
}
function bgPaint() {
  const g = ctx.createLinearGradient(0, 0, 0, H);
  g.addColorStop(0, C.bgTop); g.addColorStop(1, C.bgBot);
  ctx.fillStyle = g;
  ctx.fillRect(0, 0, W, H);
}
function bgScenePaint() {
  const g = ctx.createLinearGradient(0, 0, 0, H);
  g.addColorStop(0, C.bgScene); g.addColorStop(1, C.bgDeep);
  ctx.fillStyle = g;
  ctx.fillRect(0, 0, W, H);
}
function setFont(px, weight) {
  ctx.font = (weight || 800) + ' ' + px + 'px ' + TXT;
  ctx.textAlign = 'center';
  ctx.textBaseline = 'alphabetic';
}
function fitSize(text, px, maxW, weight) {
  let s = px;
  while (s > 18) {
    setFont(s, weight);
    if (ctx.measureText(text).width <= maxW) break;
    s -= 2;
  }
  return s;
}
function ctext(text, cy, maxW, px, weight, color) {
  ctx.fillStyle = color;
  const s = fitSize(text, px, maxW, weight);
  setFont(s, weight);
  ctx.fillText(text, W / 2, cy);
  return s;
}
function alpha(tt, a0, a1, t0, t1) {
  if (tt < t0) return 0;
  if (tt > t1) return a1;
  return a0 + (a1 - a0) * (tt - t0) / (t1 - t0);
}
function ease(t) { return t < 0 ? 0 : t > 1 ? 1 : 1 - (1 - t) * (1 - t); }

function decorRings(accentDots) {
  ctx.lineWidth = 3;
  ctx.strokeStyle = C.card;
  for (const [cx, cy, r] of [[60, 250, 420], [40, 200, 300], [W - 40, H - 260, 430], [W - 90, H - 340, 290]]) {
    ctx.beginPath(); ctx.arc(cx, cy, r, 0, Math.PI * 2); ctx.stroke();
  }
  if (accentDots) {
    ctx.fillStyle = C.accent;
    for (const [cx, cy, r] of accentDots) { ctx.beginPath(); ctx.arc(cx, cy, r, 0, Math.PI * 2); ctx.fill(); }
  }
}
/* =============================================================
   SCENE 1 — HOOK (0.0 – 4.2s)
   ============================================================= */
function drawS1(t) {
  bgPaint();
  decorRings([[950, 320, 10], [120, 1580, 9], [930, 1720, 7]]);

  const e = ease(alpha(t, 0, 1, 0.25, 0.85));
  if (e > 0.01) {
    ctx.globalAlpha = e;
    ctx.letterSpacing = '7px';
    ctx.font = '800 34px ' + TXT;
    ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    const label = 'AFTER A LONG DAY';
    const tw = ctx.measureText(label).width;
    const py = 430, ph = 74;
    rr(W / 2 - (tw + 90) / 2, py, tw + 90, ph, 40);
    ctx.strokeStyle = C.accent; ctx.lineWidth = 4; ctx.stroke();
    ctx.fillStyle = C.accent;
    ctx.fillText(label, W / 2, py + ph / 2 + 2);
    ctx.letterSpacing = '0px';
    ctx.globalAlpha = 1;
  }

  const a1 = ease(alpha(t, 0, 1, 0.95, 1.75));
  if (a1 > 0.01) {
    ctx.globalAlpha = a1;
    const y = 740 + (1 - ease(Math.min(1, (t - 0.95) / 0.5))) * 40;
    ctext('Tired after work?', y, 920, 108, 900, C.white);
  }
  const a2 = ease(alpha(t, 0, 1, 1.65, 2.4));
  if (a2 > 0.01) {
    ctx.globalAlpha = a2;
    const y = 930 + (1 - ease(Math.min(1, (t - 1.65) / 0.5))) * 40;
    ctext('So is your marketing.', y, 920, 108, 900, C.accent);
  }
  const a3 = ease(alpha(t, 0, 1, 2.55, 3.25));
  if (a3 > 0.01) {
    ctx.globalAlpha = a3;
    ctext('You fix pipes, wires & roofs all day.', 1120, 900, 48, 600, C.sub);
  }
  const a4 = ease(alpha(t, 0, 1, 3.2, 3.7));
  if (a4 > 0.01) {
    ctx.globalAlpha = a4 * 0.9;
    ctx.font = '600 32px ' + TXT;
    ctx.textAlign = 'center'; ctx.textBaseline = 'alphabetic';
    ctx.fillStyle = C.mint;
    ctx.fillText('Sound familiar?', W / 2, 1640);
    ctx.fillStyle = C.accent;
    ctx.beginPath(); ctx.arc(W / 2, 1718, 9, 0, Math.PI * 2); ctx.fill();
  }
  ctx.globalAlpha = 1;
}

/* =============================================================
   SCENE 2 — TOO TIRED AT NIGHT (4.2 – 9.6s)
   ============================================================= */
function drawS2(t) {
  bgScenePaint();

  const mt = Math.min(1, Math.max(0, (t - 6.9) / 0.8));
  if (mt > 0) {
    const mx = 850, my = 300;
    ctx.globalAlpha = mt;
    ctx.fillStyle = C.mint;
    ctx.beginPath();
    ctx.arc(mx, my, 58, 0, Math.PI * 2, false);
    ctx.arc(mx + 34, my - 24, 58, 0, Math.PI * 2, true);
    ctx.fill();
    for (let i = 0; i < 3; i++) {
      const fl = ease(Math.min(1, Math.max(0, (t - 7.1 - i * 0.5) / 0.8)));
      ctx.globalAlpha = mt * (0.9 - i * 0.22) * fl;
      ctx.font = '800 ' + (54 - i * 8) + 'px ' + TXT;
      ctx.fillStyle = C.sub;
      ctx.fillText('z', mx - 120 - i * 18, my + 90 + fl * 60 + i * 10);
    }
    ctx.globalAlpha = 1;
  }

  const a1 = ease(alpha(t, 0, 1, 4.45, 5.15));
  if (a1 > 0.01) {
    ctx.globalAlpha = a1;
    const y = 610 + (1 - ease(Math.min(1, (t - 4.45) / 0.5))) * 36;
    ctext('By the time you\'re home,', y, 900, 78, 800, C.white);
  }
  const a2 = ease(alpha(t, 0, 1, 5.25, 5.95));
  if (a2 > 0.01) {
    ctx.globalAlpha = a2;
    const y = 750 + (1 - ease(Math.min(1, (t - 5.25) / 0.5))) * 36;
    ctext('you\'re too tired to post online.', y, 900, 78, 800, C.sub);
  }

  const ap = ease(alpha(t, 0, 1, 6.35, 7.15));
  if (ap > 0.01) {
    const scale = 0.86 + 0.14 * ease(Math.min(1, (t - 6.35) / 0.6));
    ctx.save();
    ctx.translate(W / 2, 1130);
    ctx.scale(scale, scale);
    ctx.globalAlpha = ap;
    rr(-430, -150, 860, 300, 44);
    ctx.fillStyle = C.card; ctx.fill();
    rr(-430, -150, 860, 300, 44);
    ctx.strokeStyle = C.cardLine; ctx.lineWidth = 3; ctx.stroke();
    setFont(56, 800);
    ctx.fillStyle = C.white;
    ctx.fillText('That\'s normal.', 0, -34);
    setFont(40, 600);
    ctx.fillStyle = C.sub;
    ctx.fillText('Most traders feel this way.', 0, 52);
    ctx.restore();
    ctx.globalAlpha = 1;
  }

  const a4 = ease(alpha(t, 0, 1, 8.2, 8.8));
  if (a4 > 0.01) {
    ctx.globalAlpha = a4 * 0.92;
    ctx.font = '600 33px ' + TXT;
    ctx.textAlign = 'center'; ctx.textBaseline = 'alphabetic';
    ctx.fillStyle = C.mint;
    ctx.fillText('You do the work. Who does the marketing?', W / 2, 1620);
  }
  ctx.globalAlpha = 1;
}
/* =============================================================
   SCENE 3 — NEERZY FIXES IT: WHATSAPP DEMO (9.6 – 16.8s)
   ============================================================= */
const PHONE = { x: 150, y: 470, w: 780, h: 1050 };

function drawPhoneFrame(headerH) {
  const { x, y, w, h } = PHONE;
  rr(x, y, w, h, 60);
  ctx.fillStyle = C.ink; ctx.fill();
  const sx = x + 22, sy = y + 22, sw = w - 44, sh = h - 44;
  rr(sx, sy, sw, sh, 40);
  ctx.fillStyle = C.mint; ctx.fill();
  rr(sx, sy, sw, headerH, 40);
  ctx.fillStyle = C.card; ctx.fill();
  rr(sx, sy + headerH - 24, sw, 24, 0);
  ctx.fill();
  ctx.strokeStyle = C.accent; ctx.lineWidth = 3;
  ctx.beginPath(); ctx.arc(sx + 74, sy + headerH / 2, 24, 0, Math.PI * 2); ctx.stroke();
  ctx.beginPath(); ctx.arc(sx + 74, sy + headerH / 2, 13, 0, Math.PI * 2); ctx.fillStyle = C.accent; ctx.fill();
  setFont(38, 800);
  ctx.textAlign = 'left';
  ctx.fillStyle = C.white;
  ctx.fillText('Neerzy', sx + 118, sy + headerH / 2 + 8);
  setFont(24, 500);
  ctx.fillStyle = C.sub;
  ctx.fillText('Your marketing, handled', sx + 118, sy + headerH / 2 + 44);
  setFont(26, 700);
  ctx.textAlign = 'center';
  ctx.fillStyle = '#0F5132';
  rr(sx + sw - 150, sy + 16, 130, 44, 22);
  ctx.fill();
  ctx.fillStyle = C.white;
  ctx.fillText('7:42 PM', sx + sw - 85, sy + 48);
  ctx.textAlign = 'center';
  return { sx, sy, sw, sh };
}
function bubble(x, y, maxW, lines, opts) {
  const s = opts.size || 36;
  ctx.font = (opts.weight || 600) + ' ' + s + 'px ' + TXT;
  ctx.textAlign = 'left'; ctx.textBaseline = 'alphabetic';
  const pad = opts.pad || 26;
  const lh = Math.round(s * 1.42);
  const lns = Array.isArray(lines) ? lines : [lines];
  let tw = 0;
  lns.forEach(l => { tw = Math.max(tw, ctx.measureText(l).width); });
  const bw = Math.min(maxW, tw + pad * 2);
  const bh = lns.length * lh + pad * 2;
  const x0 = opts.right ? x + maxW - bw : x;
  rr(x0, y, bw, bh, 24);
  ctx.fillStyle = opts.bg || C.white; ctx.fill();
  ctx.fillStyle = opts.color || C.ink;
  lns.forEach((l, i) => ctx.fillText(l, x0 + pad, y + pad + lh * (i + 1) - 8));
  ctx.textAlign = 'center';
  return bh;
}
function resultRow(cx, y, w, text, pop) {
  if (pop <= 0.01) return 0;
  ctx.save();
  ctx.translate(cx, y + 34);
  ctx.scale(0.9 + 0.1 * pop, 0.9 + 0.1 * pop);
  ctx.globalAlpha = Math.min(1, pop);
  rr(-w / 2, -34, w, 68, 20);
  ctx.fillStyle = C.white; ctx.fill();
  ctx.beginPath(); ctx.arc(-w / 2 + 34, 0, 15, 0, Math.PI * 2);
  ctx.fillStyle = C.accent; ctx.fill();
  ctx.strokeStyle = C.ink; ctx.lineWidth = 4; ctx.lineCap = 'round'; ctx.lineJoin = 'round';
  ctx.beginPath(); ctx.moveTo(-w / 2 + 27, 0); ctx.lineTo(-w / 2 + 32, 6); ctx.lineTo(-w / 2 + 43, -7);
  ctx.stroke();
  setFont(31, 700);
  ctx.textAlign = 'left'; ctx.textBaseline = 'middle';
  ctx.fillStyle = C.ink;
  ctx.fillText(text, -w / 2 + 66, 1);
  ctx.restore();
  ctx.globalAlpha = 1;
  return 68;
}
function drawS3(t) {
  bgPaint();
  decorRings([[930, 260, 9], [120, 1750, 9]]);

  const a1 = ease(alpha(t, 0, 1, 9.8, 10.5));
  if (a1 > 0.01) {
    ctx.globalAlpha = a1;
    ctext('Neerzy fixes it.', 300, 900, 96, 900, C.white);
  }
  const a2 = ease(alpha(t, 0, 1, 10.3, 11.0));
  if (a2 > 0.01) {
    ctx.globalAlpha = a2;
    ctext('One job photo on WhatsApp — that\'s all it takes.', 396, 900, 52, 600, C.sub);
  }

  const headerH = 130;
  const { sx, sy, sw } = drawPhoneFrame(headerH);
  const chatTop = sy + headerH;
  const chatLeft = sx + 40;
  const maxBub = sw - 80;

  const dc = ease(alpha(t, 0, 1, 10.7, 11.1));
  if (dc > 0.01) {
    ctx.globalAlpha = dc;
    setFont(24, 700);
    ctx.fillStyle = C.card;
    ctx.fillText('TODAY · AFTER THE LAST JOB', sx + sw / 2, chatTop + 50);
    ctx.globalAlpha = 1;
  }

  let y1 = chatTop + 100;
  const b1 = ease(alpha(t, 0, 1, 11.0, 11.5));
  if (b1 > 0.01) {
    ctx.globalAlpha = b1;
    y1 += bubble(chatLeft, y1, maxBub, 'Long day?', { size: 36, weight: 600 });
  }
  let y2 = y1 + 58;
  const b2 = ease(alpha(t, 0, 1, 11.5, 12.0));
  if (b2 > 0.01) {
    ctx.globalAlpha = b2;
    y2 += bubble(chatLeft, y2, maxBub, ['Fixed 3 jobs today.', 'Too tired to post anywhere...'], { size: 34, weight: 600, right: true, bg: C.accent, color: C.ink });
  }
  const ty = ease(alpha(t, 0, 1, 12.2, 12.6));
  if (ty > 0.01 && t < 13.4) {
    ctx.globalAlpha = ty;
    rr(chatLeft, y2 + 24, 112, 62, 31);
    ctx.fillStyle = C.white; ctx.fill();
    for (let i = 0; i < 3; i++) {
      ctx.globalAlpha = ty * (0.5 + 0.5 * Math.sin(t * 9 - i * 0.9));
      ctx.beginPath();
      ctx.arc(chatLeft + 30 + i * 26, y2 + 55, 7, 0, Math.PI * 2);
      ctx.fillStyle = C.card; ctx.fill();
    }
    ctx.globalAlpha = 1;
  }
  const rows = [
    ['Posted your job on Google', 12.7],
    ['Review request sent to your customer', 13.7],
    ['Website updated automatically', 14.7]
  ];
  let y3 = y2 + 150;
  for (const [text, tRow] of rows) {
    const pop = ease(alpha(t, 0, 1, tRow, tRow + 0.55));
    if (pop > 0.01) {
      setFont(31, 700);
      const wRow = Math.min(maxBub, 140 + ctx.measureText(text).width);
      resultRow(sx + sw / 2, y3, wRow, text, pop);
      y3 += 100;
    }
  }

  const a3 = ease(alpha(t, 0, 1, 15.7, 16.2));
  if (a3 > 0.01) {
    ctx.globalAlpha = a3;
    setFont(40, 800);
    const label = 'Google  +  reviews  +  website — done.';
    const tw = ctx.measureText(label).width + 130;
    rr(W / 2 - tw / 2, PHONE.y + PHONE.h + 62, tw, 100, 50);
    ctx.fillStyle = C.accent; ctx.fill();
    setFont(38, 800);
    ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    ctx.fillStyle = C.ink;
    ctx.fillText(label, W / 2, PHONE.y + PHONE.h + 112);
    ctx.globalAlpha = 1;
  }
}
/* =============================================================
   SCENE 4 — YOU REST, WE WORK (16.8 – 19.8s)
   ============================================================= */
function drawNeerzyWord(x, y, scale) {
  ctx.strokeStyle = C.accent;
  ctx.globalAlpha = 0.35;
  ctx.lineWidth = 4 * scale;
  ctx.beginPath(); ctx.arc(x, y, 72 * scale, 0, Math.PI * 2); ctx.stroke();
  ctx.globalAlpha = 0.9;
  ctx.beginPath(); ctx.arc(x, y, 48 * scale, 0, Math.PI * 2); ctx.stroke();
  ctx.fillStyle = C.accent;
  ctx.beginPath(); ctx.arc(x, y, 26 * scale, 0, Math.PI * 2); ctx.fill();
  ctx.fillStyle = C.white;
  ctx.beginPath(); ctx.arc(x, y, 10 * scale, 0, Math.PI * 2); ctx.fill();
  ctx.globalAlpha = 1;
  ctx.letterSpacing = '10px';
  setFont(76 * scale, 900);
  ctx.fillStyle = C.white;
  ctx.fillText('NEERZY', x, y + 190 * scale);
  ctx.letterSpacing = '0px';
}
function drawS4(t) {
  bgScenePaint();
  decorRings([[150, 1600, 9], [900, 300, 9]]);

  const a1 = ease(alpha(t, 0, 1, 16.95, 17.6));
  if (a1 > 0.01) {
    ctx.globalAlpha = a1;
    const y = 780 + (1 - ease(Math.min(1, (t - 16.95) / 0.55))) * 50;
    ctext('You rest.', y, 860, 148, 900, C.white);
  }
  const a2 = ease(alpha(t, 0, 1, 17.7, 18.35));
  if (a2 > 0.01) {
    ctx.globalAlpha = a2;
    const y = 990 + (1 - ease(Math.min(1, (t - 17.7) / 0.55))) * 50;
    ctext('We work.', y, 860, 148, 900, C.accent);
  }
  const a3 = ease(alpha(t, 0, 1, 18.5, 19.1));
  if (a3 > 0.01) {
    ctx.globalAlpha = a3;
    ctx.font = '600 42px ' + TXT;
    ctx.textAlign = 'center'; ctx.textBaseline = 'alphabetic';
    ctx.fillStyle = C.sub;
    ctx.fillText('Google page  ·  reviews  ·  website — all handled.', W / 2, 1210);
  }
  ctx.globalAlpha = 1;
}

/* =============================================================
   SCENE 5 — OUTRO CTA (19.8 – 22.5s)
   ============================================================= */
function drawS5(t) {
  bgPaint();
  decorRings([[950, 330, 8], [110, 1560, 8], [960, 1680, 10]]);

  const a0 = ease(alpha(t, 0, 1, 19.9, 20.5));
  if (a0 > 0.01) {
    ctx.globalAlpha = a0;
    drawNeerzyWord(W / 2, 430, 1);
  }
  const a1 = ease(alpha(t, 0, 1, 20.2, 20.75));
  if (a1 > 0.01) {
    ctx.globalAlpha = a1;
    ctext('Send one WhatsApp message after every job.', 780, 900, 44, 600, C.sub);
  }
  const a2 = ease(alpha(t, 0, 1, 20.5, 21.2));
  if (a2 > 0.01) {
    const scale = 0.88 + 0.12 * ease(Math.min(1, (t - 20.5) / 0.6));
    ctx.save();
    ctx.translate(W / 2, 1040);
    ctx.scale(scale, scale);
    ctx.globalAlpha = a2;
    setFont(56, 900);
    const label = 'See how easy it is';
    const tw = ctx.measureText(label).width;
    rr(-(tw + 170) / 2, -78, tw + 170, 156, 78);
    ctx.fillStyle = C.accent; ctx.fill();
    ctx.fillStyle = C.ink;
    ctx.fillText(label, 0, 8);
    ctx.restore();
    ctx.globalAlpha = 1;
  }
  const a3 = ease(alpha(t, 0, 1, 21.3, 21.8));
  if (a3 > 0.01) {
    ctx.globalAlpha = a3;
    ctx.font = '600 36px ' + TXT;
    ctx.textAlign = 'center'; ctx.textBaseline = 'alphabetic';
    ctx.fillStyle = C.mint;
    ctx.fillText('Start free at neerzy.com — tap the link in bio', W / 2, 1300);
  }
  ctx.globalAlpha = 1;
}
/* =============================================================
   DISPATCH + transitions + public API
   ============================================================= */
const REEL = { DURATION: 22.5 };
const BOUNDS = [4.2, 9.6, 16.8, 19.8];

function draw(t) {
  ctx.clearRect(0, 0, W, H);
  if (t < 4.2) drawS1(t);
  else if (t < 9.6) drawS2(t);
  else if (t < 16.8) drawS3(t);
  else if (t < 19.8) drawS4(t);
  else drawS5(t);
  for (const b of BOUNDS) {
    const d = Math.abs(t - b);
    if (d < 0.38) {
      ctx.globalAlpha = (1 - d / 0.38) * 0.97;
      ctx.fillStyle = '#000000';
      ctx.fillRect(0, 0, W, H);
      ctx.globalAlpha = 1;
    }
  }
}

let paused = false;
function frameAt(t) {
  paused = true;
  draw(Math.max(0, Math.min(REEL.DURATION - 0.04, t)));
}
window.__reel = REEL;
window.__frameAt = frameAt;
window.__pausePreview = () => { paused = true; };
window.__playPreview = () => { paused = false; };

let t0 = null;
function raf(now) {
  if (!paused) {
    if (t0 === null) t0 = now;
    const t = ((now - t0) / 1000) % REEL.DURATION;
    draw(t);
  }
  requestAnimationFrame(raf);
}
requestAnimationFrame(raf);

document.fonts.ready.then(() => { window.__reelReady = true; });
</script>
</body>

</script>
