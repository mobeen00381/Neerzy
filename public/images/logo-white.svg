<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 60" width="240" height="60">
  <!-- Icon: Modern Local Visibility Gear/Target -->
  <g transform="translate(10, 5)">
    <!-- Outer Gear/Target Rings -->
    <circle cx="25" cy="25" r="22" fill="none" stroke="#25D366" stroke-width="2.5" opacity="0.3" />
    <circle cx="25" cy="25" r="16" fill="none" stroke="#25D366" stroke-width="3" />
    
    <!-- Outer Gear teeth-like radar marks -->
    <line x1="25" y1="3" x2="25" y2="7" stroke="#25D366" stroke-width="3" stroke-linecap="round" />
    <line x1="25" y1="43" x2="25" y2="47" stroke="#25D366" stroke-width="3" stroke-linecap="round" />
    <line x1="3" y1="25" x2="7" y2="25" stroke="#25D366" stroke-width="3" stroke-linecap="round" />
    <line x1="43" y1="25" x2="47" y2="25" stroke="#25D366" stroke-width="3" stroke-linecap="round" />
    
    <!-- Central Target Node -->
    <circle cx="25" cy="25" r="8" fill="#25D366" />
    <circle cx="25" cy="25" r="3" fill="#FFFFFF" />
  </g>

  <!-- Typography: Geometric, Ultra-Bold Modern Sans-Serif -->
  <text x="75" y="42" font-family="'Inter', 'Outfit', 'Segoe UI', sans-serif" font-size="34" font-weight="900" letter-spacing="2" fill="#FFFFFF">NEERZY</text>
</svg>
